name: Deploy Upgrade La 79 Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Optional SHA confirmation; defaults to the selected main commit'
        required: false
        type: string
      backend_sha:
        description: 'Optional exact backend SHA for a coordinated release'
        required: false
        type: string
      backup_id:
        description: 'Verified private backup directory ID'
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: upgrade79-frontend-production
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.sha }}
      REQUESTED_SHA: ${{ inputs.release_sha }}
      RELEASE_RUN_NUMBER: ${{ github.run_number }}
      BACKEND_SHA: ${{ inputs.backend_sha }}
      BACKUP_ID: ${{ inputs.backup_id }}

    steps:
      - name: Validate automatic event or optional manual confirmations
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$REQUESTED_SHA" ]; then test "$REQUESTED_SHA" = "$RELEASE_SHA"; fi
          [[ "$RELEASE_RUN_NUMBER" =~ ^[0-9]+$ ]]
          if [ -n "$BACKEND_SHA" ]; then [[ "$BACKEND_SHA" =~ ^[0-9a-f]{40}$ ]]; fi
          if [ -n "$BACKUP_ID" ]; then
            [[ "$BACKUP_ID" =~ ^release-[0-9]{8}T[0-9]{6}Z-[A-Za-z0-9]{6}$ ]]
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Frontend regression tests before build or upload
        run: npm test

      - name: Audit API configuration
        run: |
          echo "=== Referencias antiguas en src ==="
          if git grep -n "crmupgradecol.com" -- src; then
            echo "ERROR: Referencias antiguas en el codigo."
            exit 1
          fi

          echo "=== Variables de produccion ==="
          grep -nE '^(VITE_API_BASE_URL|PUBLIC_SITE_URL)=' .env.production || true

      - name: Build production
        env:
          VITE_API_BASE_URL: https://upgradecolombia.com
          PUBLIC_SITE_URL: https://upgradecolombia.com
        run: npm run build

      - name: Verify build output
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -f dist/index.html
          test -d dist/assets
          test -f dist/seo/entry-server.js
          test -f dist/seo/template.html
          test -f dist/seo/apache.conf
          test -f dist/seo/.htaccess
          test -f dist/seo/routes.json
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          grep -q '<title>' dist/index.html
          grep -q '<h1' dist/index.html
          if grep -q '<!--seo-head-->' dist/index.html; then
            echo "ERROR: Home sigue siendo un template SSR sin procesar."
            exit 1
          fi
          test -f dist/sw.js
          test -f dist/manifest.webmanifest
          test -f dist/offline.html
          test -f dist/icons/pwa-192.png
          test -f dist/icons/pwa-512.png
          test -f dist/icons/pwa-maskable-512.png
          test -f dist/icons/apple-touch-icon.png
          node --check dist/sw.js

          echo "=== Commit ==="
          git rev-parse --short HEAD

          echo "=== JavaScript principal ==="
          grep -oE 'src="/assets/[^"]+"' dist/index.html

          echo "=== Comprobacion de dominio ==="
          if grep -Rl 'https://crmupgradecol.com' dist/assets --include='*.js'; then
            echo "ERROR: El build contiene el dominio antiguo."
            exit 1
          fi

          echo "=== Dominio correcto ==="
          grep -Rl 'https://upgradecolombia.com' dist/assets --include='*.js' | head -n 10

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -a dist/. deploy-package/
          cp scripts/install-seo-routing.php deploy-package/seo/install-seo-routing.php

          # Archivos administrados directamente en Hostinger
          rm -f deploy-package/.htaccess
          rm -f deploy-package/laravel-api.php
          rm -f deploy-package/laravel-api.php.bak

          test -f deploy-package/index.html
          test -d deploy-package/assets
          test -f deploy-package/sw.js
          test -f deploy-package/manifest.webmanifest
          test -f deploy-package/offline.html
          test -d deploy-package/icons
          test -f deploy-package/robots.txt
          test -f deploy-package/sitemap.xml
          test -f deploy-package/seo/apache.conf
          FORBIDDEN=$(find deploy-package -type f \( -name '.env*' -o -name '*.sql' -o -name '*.sql.gz' -o -name '*.dump' -o -name '*.bak' \) -print -quit)
          test -z "$FORBIDDEN"
          test -z "$(find deploy-package -type l -print -quit)"

          echo "=== Archivo que se publicara ==="
          grep -oE 'src="/assets/[^"]+"' deploy-package/index.html

          printf '%s\n' "$RELEASE_SHA" > deploy-package/RELEASE_COMMIT
          (cd deploy-package && find . -type f -print0 | sort -z | xargs -0 sha256sum) > deployment-sha256.txt
          cp deployment-sha256.txt deploy-package/DEPLOY_SHA256SUMS

      - name: Upload private candidate without publishing
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          source: "deploy-package/*"
          target: "/home/${{ secrets.HOSTINGER_USERNAME }}/upgrade79-deploy-incoming/frontend/${{ github.sha }}"
          strip_components: 1
          overwrite: true
          rm: false

      - name: Publish under shared lock and verify deployment
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: 65002
          command_timeout: 30m
          envs: RELEASE_SHA,RELEASE_RUN_NUMBER,BACKEND_SHA,BACKUP_ID
          script: |
            bash -se <<'UPGRADE79_REMOTE'
            set -euo pipefail
            umask 077
            command -v flock > /dev/null
            exec 9>"$HOME/.upgrade79-deploy.lock"
            flock -w 900 9

            FRONT="$HOME/domains/upgradecolombia.com/public_html"
            PROJECT="$HOME/domains/crmupgradecol.com/laravel"
            CANDIDATE="$HOME/upgrade79-deploy-incoming/frontend/$RELEASE_SHA"
            STATE="$HOME/.upgrade79-frontend-deploy-state"
            if [ -f "$STATE" ]; then
              read -r PUBLISHED_RUN PUBLISHED_SHA < "$STATE"
              [[ "$PUBLISHED_RUN" =~ ^[0-9]+$ ]]
              test "$RELEASE_RUN_NUMBER" -ge "$PUBLISHED_RUN"
              if [ "$RELEASE_RUN_NUMBER" = "$PUBLISHED_RUN" ]; then test "$RELEASE_SHA" = "$PUBLISHED_SHA"; fi
            fi
            test "$(cat "$CANDIDATE/RELEASE_COMMIT")" = "$RELEASE_SHA"
            (cd "$CANDIDATE" && sha256sum --check --quiet DEPLOY_SHA256SUMS)
            chmod 700 "$CANDIDATE"
            find "$CANDIDATE" -mindepth 1 -type d -exec chmod 755 {} +
            find "$CANDIDATE" -type f -exec chmod 644 {} +
            test -f "$FRONT/laravel-api.php"
            test -f "$FRONT/.htaccess"
            test ! -f "$PROJECT/storage/framework/down"
            if [ -n "$BACKEND_SHA" ]; then test "$(git -C "$PROJECT" rev-parse HEAD)" = "$BACKEND_SHA"; fi
            if [ -n "$BACKUP_ID" ]; then
              BACKUP="$HOME/upgrade79-private-backups/$BACKUP_ID"
              test -f "$BACKUP/RESTORE_VERIFIED"
              (cd "$BACKUP" && sha256sum --check --quiet SHA256SUMS)
            fi
            cd "$PROJECT"
            php ops/release-preflight.php --require-current

            echo "=== Respaldo automatico del frontend anterior ==="
            install -d -m 700 "$HOME/upgrade79-deploy-rollbacks"
            ROLLBACK=$(mktemp -d "$HOME/upgrade79-deploy-rollbacks/frontend-$RELEASE_SHA-XXXXXX")
            tar --exclude='./storage' -czf "$ROLLBACK/frontend-code.tar.gz" -C "$FRONT" .
            gzip -t "$ROLLBACK/frontend-code.tar.gz"
            sha256sum "$ROLLBACK/frontend-code.tar.gz" > "$ROLLBACK/SHA256SUMS"

            echo "=== Publicar assets antes del HTML, sin tocar bridge/storage ==="
            install -d "$FRONT/assets"
            cp -a "$CANDIDATE/assets/." "$FRONT/assets/"
            for SOURCE in "$CANDIDATE"/*; do
              NAME=$(basename "$SOURCE")
              case "$NAME" in
                index.html|assets|storage|RELEASE_COMMIT|DEPLOY_SHA256SUMS|laravel-api.php|laravel-api.php.bak) continue ;;
              esac
              cp -a "$SOURCE" "$FRONT/"
            done
            cp "$CANDIDATE/index.html" "$FRONT/.upgrade79-index-$RELEASE_SHA.tmp"
            chmod 644 "$FRONT/.upgrade79-index-$RELEASE_SHA.tmp"
            mv "$FRONT/.upgrade79-index-$RELEASE_SHA.tmp" "$FRONT/index.html"
            printf '%s %s\n' "$RELEASE_RUN_NUMBER" "$RELEASE_SHA" > "$STATE.tmp"
            mv "$STATE.tmp" "$STATE"

            echo "=== JavaScript publicado ==="
            grep -oE 'src="/assets/[^"]+"' "$FRONT/index.html"

            echo "=== Archivos de Laravel ==="
            test -f "$FRONT/laravel-api.php"
            test -f "$FRONT/.htaccess"
            # Install only a managed block; preserve the existing API bridge,
            # domain redirects and Hostinger settings. Keeps a private backup.
            php "$FRONT/seo/install-seo-routing.php" "$FRONT"
            test -f "$FRONT/seo/.htaccess"
            test -f "$FRONT/sw.js"
            test -f "$FRONT/manifest.webmanifest"
            test -f "$FRONT/offline.html"
            test -f "$FRONT/icons/pwa-192.png"
            test -f "$FRONT/icons/pwa-512.png"

            echo "=== Comprobar Service Worker publico ==="
            # Fail if a rewrite sends SW requests to the SPA or login page.
            curl --fail --silent --show-error --dump-header /tmp/upgrade79-sw-headers \
              https://upgradecolombia.com/sw.js -o /tmp/upgrade79-sw-body
            grep -qiE '^content-type:.*(javascript|ecmascript)' /tmp/upgrade79-sw-headers
            grep -q "addEventListener('push'" /tmp/upgrade79-sw-body
            if grep -qiE '^cache-control:.*immutable' /tmp/upgrade79-sw-headers; then
              echo "ERROR: /sw.js no debe tener cache inmutable."
              exit 1
            fi

            echo "=== Comprobar archivo principal ==="
            JS=$(grep -oE 'src="/assets/[^"]+\.js"' "$FRONT/index.html" | head -n 1 | cut -d '"' -f 2)
            test -n "$JS"
            test -f "$FRONT$JS"

            echo "=== Comprobar dominio antiguo ==="
            if grep -q 'https://crmupgradecol.com' "$FRONT$JS"; then
              echo "ERROR: El JavaScript activo contiene el dominio antiguo."
              exit 1
            fi

            echo "=== Comprobar API y frontend ==="
            API_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Accept: application/json' https://upgradecolombia.com/api/auth/me)
            FRONT_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' https://upgradecolombia.com/)

            echo "API: $API_STATUS"
            echo "Frontend: $FRONT_STATUS"

            test "$API_STATUS" = "401"
            test "$FRONT_STATUS" = "200"

            echo "=== Comprobar SEO publico real ==="
            curl --fail --silent --show-error -D /tmp/upgrade79-robots-headers \
              https://upgradecolombia.com/robots.txt -o /tmp/upgrade79-robots
            grep -qi '^content-type: text/plain' /tmp/upgrade79-robots-headers
            grep -q '^Sitemap: https://upgradecolombia.com/sitemap.xml' /tmp/upgrade79-robots
            curl --fail --silent --show-error -D /tmp/upgrade79-sitemap-headers \
              https://upgradecolombia.com/sitemap.xml -o /tmp/upgrade79-sitemap
            grep -qiE '^content-type: (application|text)/xml' /tmp/upgrade79-sitemap-headers
            grep -q '<urlset' /tmp/upgrade79-sitemap
            curl --fail --silent --show-error https://upgradecolombia.com/ -o /tmp/upgrade79-home
            grep -q '<title>' /tmp/upgrade79-home
            grep -q '<h1' /tmp/upgrade79-home
            grep -q 'rel="canonical" href="https://upgradecolombia.com/"' /tmp/upgrade79-home
            if grep -q '<!--seo-head-->' /tmp/upgrade79-home; then
              echo "ERROR: Produccion sirve el shell sin prerender."
              exit 1
            fi
            MISSING_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' https://upgradecolombia.com/__seo-deploy-missing__)
            test "$MISSING_STATUS" = "404"
            WWW_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' https://www.upgradecolombia.com/tienda)
            test "$WWW_STATUS" = "301"

            echo "DEPLOY VALIDADO CORRECTAMENTE"
            UPGRADE79_REMOTE
